name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-X github.com/Vime-Labs/cmx/cmd.Version=${VERSION} -s -w"
          mkdir -p dist

          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/cmx-linux-amd64     .
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/cmx-linux-arm64     .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/cmx-darwin-amd64    .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/cmx-darwin-arm64    .
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/cmx-windows-amd64.exe .

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/cmx-linux-amd64
            dist/cmx-linux-arm64
            dist/cmx-darwin-amd64
            dist/cmx-darwin-arm64
            dist/cmx-windows-amd64.exe
            dist/checksums.txt
